<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title">
<title id="title">Synthetic Glasgow urban heat analysis dashboard</title>
<rect width="1200" height="650" fill="#fbfcfc"/><style>.t{font-family:Arial,sans-serif;fill:#123047}.h{font-size:27px;font-weight:bold}.s{font-size:15px}.p{font-size:17px;font-weight:bold}.n{font-size:13px}</style>
<text x="45" y="48" class="t h">Glasgow urban heat and green infrastructure</text><text x="45" y="75" class="t s">Synthetic demonstration · LST, NDVI, land cover and surface-UHI screening</text>
<g transform="translate(45 120)"><text class="t p">Land surface temperature (°C)</text><rect y="18" width="330" height="270" fill="#f5e7bd"/><circle cx="176" cy="146" r="94" fill="#d6593b"/><circle cx="176" cy="146" r="57" fill="#9d2938"/><path d="M0 160 Q90 118 180 161 T330 154" fill="none" stroke="#4f9cc1" stroke-width="13"/><text y="315" class="t n">Higher surface temperatures cluster in the synthetic urban core.</text></g>
<g transform="translate(435 120)"><text class="t p">Vegetation greenness (NDVI)</text><rect y="18" width="330" height="270" fill="#eee6c0"/><path d="M0 18H85V288H0ZM245 18H330V185H245Z" fill="#317a50"/><circle cx="170" cy="152" r="46" fill="#c8d985"/><path d="M0 160 Q90 118 180 161 T330 154" fill="none" stroke="#4f9cc1" stroke-width="13"/><text y="315" class="t n">Higher NDVI is concentrated in synthetic forest and grassland areas.</text></g>
<g transform="translate(825 120)"><text class="t p">NDVI-LST association</text><rect y="18" width="330" height="270" fill="#fff" stroke="#d5dfe2"/><line x1="42" y1="250" x2="295" y2="54" stroke="#d6593b" stroke-width="4"/><g fill="#2b7a78"><circle cx="70" cy="220" r="5"/><circle cx="104" cy="195" r="5"/><circle cx="148" cy="166" r="5"/><circle cx="190" cy="128" r="5"/><circle cx="236" cy="92" r="5"/></g><text x="42" y="275" class="t n">NDVI →</text><text x="8" y="45" class="t n">LST</text><text y="315" class="t n">Regression and bootstrap intervals are generated by the workflow.</text></g>
<line x1="45" y1="485" x2="1155" y2="485" stroke="#d5dfe2"/><text x="45" y="525" class="t p">Interpretation safeguard</text><text x="45" y="554" class="t s">Satellite LST is a daytime surface measurement - not air temperature, heat-health risk or an operational planning decision.</text><text x="45" y="600" class="t n">Workflow: validate inputs → derive NDVI → classify surface-UHI → sample → regress → report land-cover statistics.</text>
</svg>
